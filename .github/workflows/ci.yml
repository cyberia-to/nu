name: Embedded Nu libraries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    name: Libraries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1.12.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint embedded libraries
        run: >-
          cargo clippy --locked --lib
          -p nu-protocol -p nu-engine -p nu-parser -p nu-command
          -p nu-cmd-lang -p nu-cmd-extra -p nu-cli -p nu-std -p nu-utils
          -- -D warnings -D clippy::unwrap_used -D clippy::unchecked_duration_subtraction
      - name: Build shell required by library tests
        run: cargo build --locked --bin nu
      - name: Embedded library tests
        run: >-
          cargo test --locked --lib
          -p nu-protocol -p nu-engine -p nu-parser -p nu-command
          -p nu-cmd-lang -p nu-cmd-extra -p nu-cli -p nu-std -p nu-utils
